global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:3000"]

  - job_name: "products"
    static_configs:
      - targets: ["products:3001"]

  - job_name: "orders"
    static_configs:
      - targets: ["orders:3002"]

  - job_name: "logging"
    static_configs:
      - targets: ["logging:3003"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
