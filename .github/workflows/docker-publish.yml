name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push moleculer-logging-service
        uses: docker/build-push-action@v5
        with:
          context: ./moleculer-logging-service
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/moleculer-logging-service:latest

      - name: Build and push moleculer-order-service
        uses: docker/build-push-action@v5
        with:
          context: ./moleculer-order-service
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/moleculer-order-service:latest

      - name: Build and push moleculer-product-service
        uses: docker/build-push-action@v5
        with:
          context: ./moleculer-product-service
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/moleculer-product-service:latest

      - name: Build and push moleculer-api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./moleculer-api-gateway
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/moleculer-api-gateway:latest